[theme]
# Modo claro forzado en toda la app (también en la pantalla de login, que se
# renderiza antes del CSS inyectado, por eso se fija aquí desde el servidor).
base = "light"
primaryColor = "#00417B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FB"
textColor = "#1A1C1E"

[client]
# Oculta el botón "Deploy" y el menú de 3 puntos desde el primer render del
# servidor, así no aparecen ni durante la carga ni en la pantalla de login.
toolbarMode = "minimal"
